services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - openwebui
      - livezilla
    networks:
      - webnet

  livezilla:
    image: livezilla-custom
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile-livezilla
    volumes:
      - livezilla_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webnet

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    networks:
      - webnet

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama/models
    networks:
      - webnet

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      # Nur localhost: Docker-Portfreigaben umgehen UFW. Open WebUI nutzt qdrant:6333.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - webnet

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=livezilla
      - MYSQL_USER=livezilla
      - MYSQL_PASSWORD=${DB_USER_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - webnet

volumes:
  livezilla_data:
  openwebui_data:
  qdrant_data:
  ollama_models:
  mysql_data:

networks:
  webnet:
    driver: bridge
